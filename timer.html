<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Timer · WAECPrep</title><link rel="stylesheet" href="css/style.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html">WAEC<span>Prep</span></a><div class="links"><a href="index.html">Dashboard</a><a href="subjects.html">Subjects</a><a href="timetable.html">Timetable</a><a href="timer.html">Timer</a><a href="calculator.html">Calculator</a></div></nav><section class="page"><div class="eyebrow">Focus</div><h1>Study timer.</h1><div class="card"><div id="timer" class="timer">25:00</div><div class="timer-controls"><button onclick="startTimer()">Start</button><button onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset</button><button onclick="setTimer(25)">25 min</button><button onclick="setTimer(50)">50 min</button></div></div></section><script>let total=1500,left=1500,id=null;function render(){let m=Math.floor(left/60),s=left%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}function startTimer(){if(id)return;id=setInterval(()=>{if(left<=0){clearInterval(id);id=null;alert("Focus session complete. Take a short break.");return}left--;render()},1000)}function pauseTimer(){clearInterval(id);id=null}function resetTimer(){pauseTimer();left=total;render()}function setTimer(min){pauseTimer();total=left=min*60;render()}</script><footer>WAECPrep · Built for focused WAEC preparation. Always verify official exam details with WAEC.</footer></div><script src="js/app.js"></script></body></html>
