<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Calculator · WAECPrep</title><link rel="stylesheet" href="css/style.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html">WAEC<span>Prep</span></a><div class="links"><a href="index.html">Dashboard</a><a href="subjects.html">Subjects</a><a href="timetable.html">Timetable</a><a href="timer.html">Timer</a><a href="calculator.html">Calculator</a></div></nav><section class="page"><div class="eyebrow">Tools</div><h1>Calculator.</h1><div class="card calc"><input id="display" class="display" readonly><div class="keys"><button class="" onclick="press("C")">C</button><button class="" onclick="press("\u232b")">⌫</button><button class="" onclick="press("/")">/</button><button class="" onclick="press("*")">*</button><button class="" onclick="press("7")">7</button><button class="" onclick="press("8")">8</button><button class="" onclick="press("9")">9</button><button class="" onclick="press("-")">-</button><button class="" onclick="press("4")">4</button><button class="" onclick="press("5")">5</button><button class="" onclick="press("6")">6</button><button class="" onclick="press("+")">+</button><button class="" onclick="press("1")">1</button><button class="" onclick="press("2")">2</button><button class="" onclick="press("3")">3</button><button class="" onclick="press("=")">=</button><button class="wide" onclick="press("0")">0</button><button class="" onclick="press(".")">.</button></div></div></section><script>let expr="";function press(k){if(k==="C"){expr=""}else if(k==="⌫"){expr=expr.slice(0,-1)}else if(k==="="){try{expr=String(Function("return "+expr)())}catch(e){expr="Error"}}else{expr+=k}document.getElementById("display").value=expr}</script><footer>WAECPrep · Built for focused WAEC preparation. Always verify official exam details with WAEC.</footer></div><script src="js/app.js"></script></body></html>
